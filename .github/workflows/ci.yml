name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Tests + 100% coverage gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Sync dependencies (locked)
        run: uv sync --frozen --all-groups

      - name: Run tests with 100% coverage gate
        run: |
          uv run pytest \
            --cov=a23crypt \
            --cov-report=term-missing \
            --cov-fail-under=100 \
            -q

      - name: Verify package builds cleanly
        run: uv build
